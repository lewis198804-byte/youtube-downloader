<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Details</title>
        <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body>
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container text-center">
            <h1 class="h1 mb-0">Video Downloader</h1>
        </div>
    </header>
    <main>
        <section class="card p-3 text-center">
            <h3 class="mb-0">Channel</h3>
            <p>{{video_author}}</p>
            <h3 class="mb-0">Title</h3>
            <p>{{video_title}}</p>
            <h3 class="mb-0">Length</h3>
            <p>{{video_length}}</p>
        </section>
        <section class="card p-3 text-center">
            <form action="/download" method="post">
                <p><label>Audio only?</label> <input type="checkbox" name="audio_only"></p>
                <button type="submit">Download</button>
                
            </form>
            <a href="/" class="mt-3"><button >Go back</button></a>
        </section>
    </main>
 <!-- Bootstrap JS (optional, for components like modals, dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
