<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
        <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body>
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container text-center">
            <h1 class="h1 mb-0">Video Downloader</h1>
        </div>
    </header>
    <main>
        <section class="card p-3 text-center">
            <video id="player" height="500" controls>
                <source src={{media_url}} type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>
        <section>
            <div class="card text-center mx-auto" style="width: 30rem;">
                <div class="card-header">
                    Actions
                </div>
                <div class="card-body" >
                    <div class="btn-group" role="group" aria-label="Basic example"></div>
                        <button id ="time_button" type="button" class="btn btn-primary">Save Progress</button>
                        <button id ="skip_button" type="button" class="btn btn-primary">skip around</button>
                        <button type="button" class="btn btn-primary">Delete</button>
                        <a href="/"><button type="button" class="btn btn-primary">Home</button></a>
                    </div>

                </div>
            </div>
        </section>
    </main>
 <!-- Bootstrap JS (optional, for components like modals, dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.querySelector('video');
        let progressTimer = null;

        // Function to save current video position to server
        function saveVideoProgress() {
            const currentTime = video.currentTime;
            fetch('/save_progress/{{ video_id }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({progress: currentTime})
            });
        }

        // Function to start the 10-second save timer
        function startProgressTimer() {
            progressTimer = setInterval(saveVideoProgress, 10000);  // Save every 10 seconds
        }

        // Function to stop the timer
        function stopProgressTimer() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        // When video starts playing, start the timer
        video.addEventListener('play', () => {
            startProgressTimer();
            console.log("timer started")
        });

        // When video pauses, stop timer and save immediately
        video.addEventListener('pause', () => {
            stopProgressTimer();
            saveVideoProgress();  // Save current position right away
        });



    </script>
</body>
</html>
