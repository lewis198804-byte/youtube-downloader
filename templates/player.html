<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
        <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body>
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container text-center">
            <h1 class="h1 mb-0">Study Stack</h1>
        </div>
    </header>
    <main>
        <section class="card p-3 text-center">
            <video id="player" height="500" controls>
                <source src={{media_url}} type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>
        <section>
            <div class="card text-center mx-auto" style="width: 30rem;">
                <div class="card-header">
                    Actions
                </div>
                <div class="card-body" >
                    <div class="btn-group" role="group" aria-label="Basic example"></div>
                        <button data-bs-toggle="modal" data-bs-target="#bookmarkModal" id ="bookmark_modal_open" type="button" class="btn btn-primary">Insert Bookmark</button>
                        <button type="button" class="btn btn-primary">Delete</button>
                        <a href="/"><button type="button" class="btn btn-primary">Home</button></a>
                    </div>

                </div>
            </div>
        </section>
    
        <div class="modal fade" id="bookmarkModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">New Bookmark</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="bookmark-name" class="col-form-label">Bookmark Name:</label>
                            <input type="text" class="form-control" id="bookmarkNameField">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="bookmark_button" class="btn btn-primary">Save Bookmark</button>
                </div>
                </div>
            </div>
        </div>
    </main>
 <!-- Bootstrap JS (optional, for components like modals, dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.querySelector('video');
        const bookmark_button = document.getElementById('bookmark_button');
        const bookmarkModal = new bootstrap.Modal('#bookmarkModal')
        const bmarkModal = document.getElementById("bookmarkModal")
        const bookmark_name_input = document.getElementById("bookmarkNameField")
        bmarkModal.addEventListener("shown.bs.modal", setModalFocus)
        bookmark_button.addEventListener("click",addBookmark);

        let progressTimer = null;
        let video_start_pos = '{{ video_pos }}';

        if (video_start_pos != "None") {
            video.currentTime = video_start_pos;
        }
        
        function setModalFocus(){
            bookmark_name_input.focus()
            video.pause()
        }
        function addBookmark(){
            const bookmark_time = video.currentTime;
                 
            try {
                fetch('/save_bookmark/{{ video_id }}', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({bookmark: bookmark_time, bookmark_name: bookmark_name_input.value})
                });
                bookmarkModal.hide()
                bookmark_name_input.value = ""
            } catch (error) {
                console.log(error)
            }
            
        }
        // Function to save current video position to server
        function saveVideoProgress() {
            const currentTime = video.currentTime;
            fetch('/save_progress/{{ video_id }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({progress: currentTime})
            });
        }

        // Function to start the 10-second save timer
        function startProgressTimer() {
            progressTimer = setInterval(saveVideoProgress, 10000);  // Save every 10 seconds
        }

        // Function to stop the timer
        function stopProgressTimer() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        // When video starts playing, start the timer
        video.addEventListener('play', () => {
            startProgressTimer();
            console.log("timer started")
        });

        // When video pauses, stop timer and save immediately
        video.addEventListener('pause', () => {
            stopProgressTimer();
            saveVideoProgress();  // Save current position right away
        });



    </script>
</body>
</html>
